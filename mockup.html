<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure Map</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #faf9f7;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    padding: 28px 48px;
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: #1a1a1a;
    letter-spacing: -0.5px;
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px 80px;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 64px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -1.5px;
    margin-bottom: 48px;
  }

  .hero h1 em {
    font-style: italic;
    color: #c8785a;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    padding: 20px 48px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s;
  }
  .cta-button:hover { background: #333; }
  .cta-button svg { width: 16px; height: 16px; }

  .cta-sub {
    margin-top: 14px;
    font-size: 12px;
    color: #a0a0a0;
  }
</style>
</head>
<body>

<nav>Adventure Map</nav>

<div class="hero">
  <h1>Find your next<br><em>adventure</em></h1>
  <button class="cta-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="3 11 22 2 13 21 11 13 3 11"/>
    </svg>
    Find playgrounds near me
  </button>
  <div class="cta-sub">Uses your browser location</div>
</div>

</body>
</html>
